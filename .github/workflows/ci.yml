name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Retrieval evaluation
        run: python -m bid_intel eval-retrieval
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/retrieval_report.md

  # CD: build the image, start it and test it for real, then publish it to GitHub Container Registry.
  # Pull requests build and test the image but never publish.
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bid-intel:test
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 bid-intel:test
          for i in $(seq 1 45); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health
          curl -fs "localhost:8000/search?q=Mercury%20affidavit&bid_id=Bid2&top_k=3" \
            | python3 -c "import json,sys; h=json.load(sys.stdin); assert any(x['file']=='Mercury_Affidavit.pdf' for x in h), h; print('search ok')"
          curl -fs -X POST localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question":"What is the delivery requirement for Bid2?"}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert '45 days' in r['answer'], r; print('ask ok')"
          test "$(docker run --rm bid-intel:test whoami)" = "app" && echo "runs as non-root user"
          docker image ls bid-intel:test --format 'image size: {{.Size}}'
      - name: Show container logs on failure
        if: failure()
        run: docker logs api || true
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=RFP Intelligence: hybrid RAG search and multi-agent bid extraction
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
