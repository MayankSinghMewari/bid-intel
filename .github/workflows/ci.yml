name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Retrieval evaluation
        run: python -m bid_intel eval-retrieval
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/retrieval_report.md

  # CD: build the image, start it and test it for real, then publish it to GitHub Container Registry.
  # Pull requests build and test the image but never publish.
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bid-intel:test
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 bid-intel:test
          for i in $(seq 1 45); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health
          curl -fs "localhost:8000/search?q=Mercury%20affidavit&bid_id=Bid2&top_k=3" \
            | python3 -c "import json,sys; h=json.load(sys.stdin); assert any(x['file']=='Mercury_Affidavit.pdf' for x in h), h; print('search ok')"
          curl -fs -X POST localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question":"What is the delivery requirement for Bid2?"}' \
            | python3 -c "import json,sys; r=json.load(sys.stdin); assert '45 days' in r['answer'], r; print('ask ok')"
          test "$(docker run --rm bid-intel:test whoami)" = "app" && echo "runs as non-root user"
          docker image ls bid-intel:test --format 'image size: {{.Size}}'
      - name: Show container logs on failure
        if: failure()
        run: docker logs api || true
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=RFP Intelligence: hybrid RAG search and multi-agent bid extraction
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha

  # Optional: deploy the read-only demo to a Hugging Face Docker Space. Docker Spaces need a Hugging Face PRO
  # plan (free accounts get 402 Payment Required), so this job is opt-in: set repository variable
  # HF_DEPLOY=true plus HF_SPACE ("<hf-user>/bid-intel") and secret HF_TOKEN (write). The public demo
  # otherwise runs on Streamlit Community Cloud, which redeploys from the repository on every push.
  deploy-demo:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HF_DEPLOY == 'true' && vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.25"
      - name: Preflight - check the Hugging Face token and Space name
        # Failures are reported as ::error annotations (readable without log access); the token is never printed.
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          space, tok = os.environ.get("HF_SPACE", "").strip(), os.environ.get("HF_TOKEN", "").strip()
          def fail(msg):
              print(f"::error title=Hugging Face deploy::{msg}")
              raise SystemExit(1)
          if not tok:
              fail("Secret HF_TOKEN is missing or empty (Settings > Secrets and variables > Actions > Secrets).")
          if space.startswith("http") or space.count("/") != 1:
              fail(f"Variable HF_SPACE must look like 'username/bid-intel', got '{space}'.")
          try:
              me = HfApi(token=tok).whoami()
          except Exception as exc:
              fail(f"Hugging Face rejected HF_TOKEN ({type(exc).__name__}). Create a new token with Write access.")
          user = me.get("name")
          orgs = [o.get("name") for o in me.get("orgs", [])]
          role = ((me.get("auth") or {}).get("accessToken") or {}).get("role")
          if space.split("/")[0] not in [user, *orgs]:
              fail(f"HF_SPACE namespace '{space.split('/')[0]}' does not match the token's user '{user}'. "
                   f"Set HF_SPACE to '{user}/bid-intel' (same capitalisation).")
          if role == "read":
              fail("HF_TOKEN is a Read token; deploying needs a token with Write access.")
          if me.get("emailVerified") is False:
              fail(f"The Hugging Face email of '{user}' is not verified; click the link in Hugging Face's "
                   "confirmation email, then re-run this job.")
          print(f"token ok for '{user}' (role: {role}); deploying to {space}")
          PY
      - name: Point the Space at the image that just passed the smoke test
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import CommitOperationAdd, HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space, sha = os.environ["HF_SPACE"], os.environ["GITHUB_SHA"]
          image = f"ghcr.io/{os.environ['GITHUB_REPOSITORY'].lower()}:{sha}"
          repo_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
          def fail(msg):
              print(f"::error title=Hugging Face deploy::{msg}")
              raise SystemExit(1)
          try:
              api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True, private=False)
          except Exception as exc:  # Hub error messages explain the cause and never contain the token
              fail(f"Could not create the Space {space}: {str(exc)[:400]}")
          dockerfile = (
              f"# Generated by {repo_url}/blob/{sha}/.github/workflows/ci.yml - do not edit here\n"
              f"FROM {image}\n"
              "ENV BID_INTEL_DEMO=1\n"
              "EXPOSE 8501\n"
              'CMD ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8501", '
              '"--server.headless", "true"]\n')
          readme = (
              "---\ntitle: RFP Intelligence\nemoji: 📄\ncolorFrom: blue\ncolorTo: indigo\nsdk: docker\n"
              "app_port: 8501\npinned: false\n"
              "short_description: Hybrid RAG search + multi-agent bid extraction demo\n---\n\n"
              "# RFP Intelligence (read-only demo)\n\n"
              "Hybrid RAG search and multi-agent extraction over public bid documents. LLM generation is off in this "
              f"demo. Source, evaluation and docs: {repo_url}\n\n"
              f"Deployed automatically by CI from commit `{sha[:7]}` (image `{image}`).\n")
          try:
              api.create_commit(
                  repo_id=space, repo_type="space",
                  commit_message=f"Deploy {sha[:7]}",
                  operations=[CommitOperationAdd("Dockerfile", dockerfile.encode()),
                              CommitOperationAdd("README.md", readme.encode())])
          except Exception as exc:
              fail(f"Could not update the Space {space}: {str(exc)[:400]}")
          print("deployed", image, "to", space)
          PY
      - name: Wait for the Space to run and check its health
        run: |
          python - <<'PY'
          import os, time, urllib.request
          from huggingface_hub import HfApi
          api, space = HfApi(token=os.environ["HF_TOKEN"]), os.environ["HF_SPACE"]
          def fail(msg):
              print(f"::error title=Hugging Face deploy::{msg}")
              raise SystemExit(1)
          stage = None
          time.sleep(45)  # on redeploys the old version reports RUNNING until the new build starts
          for _ in range(60):  # up to ~20 min: first build pulls a large image
              stage = api.get_space_runtime(space).stage
              print("space stage:", stage, flush=True)
              if stage == "RUNNING":
                  break
              if stage in ("BUILD_ERROR", "RUNTIME_ERROR", "CONFIG_ERROR"):
                  fail(f"Space {space} failed with stage {stage}; open https://huggingface.co/spaces/{space} and check its build logs")
              time.sleep(20)
          else:
              fail(f"Space {space} not running after waiting (last stage: {stage})")
          host = f"https://{space.replace('/', '-').replace('_', '-').lower()}.hf.space"
          for _ in range(30):
              try:
                  body = urllib.request.urlopen(f"{host}/_stcore/health", timeout=10).read().decode()
                  if body.strip() == "ok":
                      break
              except Exception as exc:
                  print("waiting for app:", exc, flush=True)
              time.sleep(10)
          else:
              fail(f"Space {space} is running but {host}/_stcore/health did not answer ok")
          url = f"https://huggingface.co/spaces/{space}"
          print("LIVE:", url, "| app:", host)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Live demo\n{url}\n")
          PY
